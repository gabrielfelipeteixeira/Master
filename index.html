<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meu Bolso">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f766e">
  <title>Meu Bolso</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Meu Bolso</h1>
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mês anterior">‹</button>
      <span id="monthLabel"></span>
      <button id="nextMonth" aria-label="Próximo mês">›</button>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card"><span>Entradas</span><strong id="sumIncome" class="pos">R$ 0,00</strong></div>
      <div class="card"><span>Saídas</span><strong id="sumExpense" class="neg">R$ 0,00</strong></div>
      <div class="card"><span>Saldo do mês</span><strong id="sumBalance">R$ 0,00</strong></div>
      <div class="card"><span>Saldo total</span><strong id="sumTotal">R$ 0,00</strong></div>
    </section>

    <section class="panel">
      <h2>Nova transação</h2>
      <form id="txForm">
        <input type="hidden" id="txId">
        <div class="type-toggle">
          <label><input type="radio" name="type" value="expense" checked> Saída</label>
          <label><input type="radio" name="type" value="income"> Entrada</label>
        </div>
        <div class="grid">
          <input id="txDesc" placeholder="Descrição" required maxlength="80">
          <input id="txAmount" type="number" step="0.01" min="0.01" placeholder="Valor (R$)" required>
          <input id="txDate" type="date" required>
          <select id="txCategory"></select>
        </div>
        <div class="actions">
          <button type="submit" id="txSubmit" class="primary">Adicionar</button>
          <button type="button" id="txCancel" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <div class="two-col">
      <section class="panel">
        <h2>Gastos por categoria</h2>
        <div id="chart" class="chart"></div>
      </section>

      <section class="panel">
        <h2>Orçamentos do mês</h2>
        <div id="budgets"></div>
        <form id="budgetForm" class="inline-form">
          <select id="budgetCategory"></select>
          <input id="budgetAmount" type="number" step="0.01" min="0" placeholder="Limite (R$)" required>
          <button type="submit">Definir</button>
        </form>
      </section>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>Transações</h2>
        <div class="filters">
          <input id="search" placeholder="Buscar...">
          <select id="filterType">
            <option value="">Todas</option>
            <option value="income">Entradas</option>
            <option value="expense">Saídas</option>
          </select>
        </div>
      </div>
      <ul id="txList" class="tx-list"></ul>
      <p id="emptyMsg" class="empty">Nenhuma transação neste mês.</p>
    </section>

    <section class="panel">
      <h2>Dados</h2>
      <div class="actions">
        <button id="exportCsv">Exportar CSV</button>
        <button id="exportJson">Backup (JSON)</button>
        <label class="btn">Restaurar backup<input type="file" id="importJson" accept="application/json" hidden></label>
        <button id="manageCats">Categorias</button>
      </div>
      <p class="hint">Seus dados ficam salvos só neste navegador. Faça backup de vez em quando.</p>
    </section>
  </main>

  <dialog id="catDialog">
    <h2>Categorias</h2>
    <ul id="catList" class="cat-list"></ul>
    <form id="catForm" class="inline-form">
      <input id="catName" placeholder="Nova categoria" required maxlength="30">
      <select id="catType">
        <option value="expense">Saída</option>
        <option value="income">Entrada</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>
    <div class="actions"><button id="catClose" class="primary">Fechar</button></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
